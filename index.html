<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b6b3a" />
  <title>Football Group Maker</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <style>
    :root{--green:#0b6b3a;--green2:#159455;--lime:#dff6e9;--ink:#10231a;--muted:#607268;--paper:#fff;--line:#d7e3dc;--danger:#b42318;--shadow:0 12px 30px rgba(16,35,26,.10)}
    *{box-sizing:border-box} html,body{max-width:100%;overflow-x:hidden} body{margin:0;background:linear-gradient(180deg,#edf8f2 0,#f7faf8 240px);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;overflow-x:hidden}
    button,input{font:inherit} button{border:0;cursor:pointer} .shell{width:min(1100px,100%);max-width:100%;margin:auto;padding:20px 14px 130px;overflow-x:hidden}
    header{display:flex;gap:12px;align-items:center;margin:4px 0 18px}.logo-wrap{width:54px;height:54px;border-radius:15px;background:#fff;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden;padding:4px;flex:0 0 auto}.logo-wrap img{display:block;width:100%;height:100%;object-fit:contain}
    h1{font-size:clamp(1.42rem,5vw,2.15rem);margin:0;letter-spacing:-.03em}.subtitle{color:var(--muted);font-size:.94rem;margin:3px 0 0}
    .card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
    .upload{border:2px dashed #8eb9a1;text-align:center;padding:28px 16px;transition:.2s;background:#fbfefc}.upload.dragover{border-color:var(--green);background:var(--lime);transform:translateY(-2px)}
    .upload strong{display:block;font-size:1.08rem;margin-bottom:6px}.upload small{display:block;color:var(--muted);margin:6px auto 16px;max-width:420px}.file-input{position:absolute;clip:rect(0,0,0,0)}
    .btn{min-height:46px;border-radius:13px;padding:11px 16px;font-weight:750;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--green);color:#fff}.primary:hover{background:#075a30}.secondary{background:#edf3ef;color:var(--ink)}.danger{background:#fff0ef;color:var(--danger);border:1px solid #ffd2ce}
    .hidden{display:none!important}.error{margin-top:12px;color:var(--danger);font-weight:650}.toolbar{display:flex;flex-direction:column;gap:12px;margin:14px 0}.toolbar-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .exercise-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 10px}.tabs{display:flex;gap:6px;min-width:0}.tab{min-height:42px;padding:9px 13px;border-radius:12px;background:#e8f0eb;color:#44564b;font-weight:800;white-space:nowrap}.tab.active{background:var(--green);color:#fff;box-shadow:0 4px 12px rgba(11,107,58,.2)}
    .trash{width:50px;height:50px;border-radius:15px;background:#fff0ef;color:var(--danger);border:2px dashed #e2928b;display:grid;place-items:center;font-size:25px;flex:0 0 auto;transition:.18s}.trash.trash-active{background:#ffd9d5;border-color:var(--danger);transform:scale(1.07)}.trash .trash-label{position:absolute;clip:rect(0,0,0,0)}
    .count-control{display:flex;align-items:center;gap:10px;width:100%}.add-player-btn{margin-left:auto;background:var(--green);color:#fff;min-width:48px;min-height:40px;padding:8px 12px;border-radius:11px;font-size:20px;font-weight:800}.add-player-btn:hover{background:#075a30}.segmented{display:flex;padding:4px;background:#e8f0eb;border-radius:14px}.segmented button{width:44px;height:40px;border-radius:10px;background:transparent;font-weight:800;color:#44564b}.segmented button.active{background:#fff;color:var(--green);box-shadow:0 3px 10px rgba(0,0,0,.10)}
    .summary{color:var(--muted);font-size:.9rem}.event-info{margin-top:10px;display:grid;gap:3px}.event-title{font-size:1.08rem;font-weight:850;color:var(--ink)}.event-meta{font-size:.94rem;color:var(--muted)}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.groups[data-count="3"]{grid-template-columns:repeat(3,minmax(0,1fr))}.group{border-radius:19px;overflow:hidden;background:#fff;border:1px solid var(--line);box-shadow:0 7px 20px rgba(16,35,26,.07)}
    .group-head{padding:13px 14px;display:flex;justify-content:space-between;align-items:center;background:var(--group-bg);border-bottom:1px solid rgba(0,0,0,.06)}.group-title{font-size:1.02rem;font-weight:850}.badge{min-width:30px;text-align:center;border-radius:999px;background:rgba(255,255,255,.8);padding:4px 9px;font-weight:800}
    .player-list{min-height:120px;padding:10px 10px 34px;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}.player{position:relative;background:#fff;border:1px solid #dbe5df;border-radius:13px;padding:13px 42px 13px 14px;font-weight:720;box-shadow:0 2px 8px rgba(16,35,26,.06);touch-action:pan-y;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.player *{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.player:after{content:"⋮⋮";position:absolute;right:14px;color:#91a097;letter-spacing:-2px}.player.manual-player{background:#ffe4e1;border-color:#efaaa3}.player[data-color="red"]{background:#ffd9d5;border-color:#e79a91}.player[data-color="blue"]{background:#dbeafe;border-color:#91b8e8}.player[data-color="green"]{background:#dcfce7;border-color:#8fd0a4}.player[data-color="yellow"]{background:#fef3c7;border-color:#dfc66e}
    .color-menu{position:fixed;z-index:60;display:flex;gap:10px;padding:12px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 36px rgba(16,35,26,.22);transform:translate(-50%,-110%)}.color-menu.hidden{display:none}.color-choice{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #bcc9c1}.color-choice.red{background:#ef6b61}.color-choice.blue{background:#5595dd}.color-choice.green{background:#4aaa6a}.color-choice.yellow{background:#eac94e}.player.sortable-ghost{opacity:.25}.player.sortable-chosen{box-shadow:0 10px 24px rgba(11,107,58,.20);border-color:#69ad86}
    .empty-note{display:none;text-align:center;color:#7b8b82;font-size:.86rem;padding:22px 8px}.player-list:empty + .empty-note{display:block}
    .bottom-bar{position:fixed;z-index:20;bottom:0;left:0;right:0;padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:rgba(255,255,255,.92);backdrop-filter:blur(13px);border-top:1px solid var(--line)}.bottom-inner{max-width:1072px;margin:auto;display:flex;gap:10px}.bottom-inner .primary{flex:1}
    .toast{position:fixed;z-index:40;left:50%;bottom:92px;transform:translate(-50%,18px);opacity:0;background:#10231a;color:#fff;padding:11px 15px;border-radius:12px;font-weight:700;pointer-events:none;transition:.25s;max-width:calc(100% - 28px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:430px){.shell{padding-left:6px;padding-right:6px}.groups{gap:6px}.group-head{padding:8px 6px}.group-title{font-size:.78rem}.badge{min-width:22px;padding:2px 5px}.player-list{padding:4px;gap:4px}.player{padding:8px 18px 8px 5px;font-size:.68rem;overflow-wrap:anywhere}.player:after{right:5px}}
    @media(min-width:660px){.shell{padding:30px 22px 120px}.toolbar{flex-direction:row;justify-content:space-between;align-items:center}.groups{gap:14px}}
    @media(min-width:960px){.groups[data-count="3"]{grid-template-columns:repeat(3,1fr)}.groups[data-count="4"]{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body>
<main class="shell">
  <header><div class="logo-wrap"><img src="https://oygardenil.no/images/logo.png" alt="Øygarden IL logo"></div><div><h1>Football Group Maker</h1><p class="subtitle">Upload attendance, sort players, share the groups.</p></div></header>

  <section id="uploadCard" class="card upload" aria-labelledby="uploadTitle">
    <strong id="uploadTitle">Upload attendance list</strong>
    <small>Reads the <b>For import</b> sheet from a Spond Event and includes only players whose Status is <b>Attending</b>.</small>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><label class="btn primary" for="fileInput">Choose Excel file</label><button id="blankListBtn" class="btn secondary" type="button">Start with blank list</button></div><input id="fileInput" class="file-input" type="file" accept=".xlsx,.xls" />
    <div id="error" class="error" role="alert"></div>
  </section>

  <section id="workspace" class="hidden">
    <div class="exercise-row"><div id="exerciseTabs" class="tabs" role="tablist" aria-label="Exercises"><button class="tab active" data-tab="0" role="tab">Exercise 1</button><button class="tab" data-tab="1" role="tab">Exercise 2</button><button class="tab" data-tab="2" role="tab">Exercise 3</button></div><div id="trash" class="trash" title="Drag a player here to delete" aria-label="Delete player"><span aria-hidden="true">🗑️</span><span class="trash-label">Delete player</span></div></div>
    <div id="summary" class="summary"></div>
    <div id="groups" class="groups" data-count="3"></div>
	<div class="toolbar">
      <div><div class="count-control"><b>Number of groups</b><div id="groupChooser" class="segmented" aria-label="Number of groups"><button data-count="2">2</button><button data-count="3" class="active">3</button><button data-count="4">4</button></div><button id="addPlayerBtn" class="add-player-btn" type="button" title="Add player" aria-label="Add player">👤➕</button></div></div>
      
    </div>
    <div id="eventInfo" class="event-info" aria-live="polite" style="margin-top:16px"></div>
  </section>
</main>

<div id="bottomBar" class="bottom-bar hidden"><div class="bottom-inner" style="justify-content:flex-start"><button id="exportBtn" class="btn primary" type="button">Copy groups</button><button id="downloadBtn" class="btn secondary" type="button">Download groups</button><button id="resetBtn" class="btn danger" type="button">Reset</button></div></div>
<div id="colorMenu" class="color-menu hidden" role="dialog" aria-label="Choose player color"><button class="color-choice red" data-color="red" aria-label="Red"></button><button class="color-choice blue" data-color="blue" aria-label="Blue"></button><button class="color-choice green" data-color="green" aria-label="Green"></button><button class="color-choice yellow" data-color="yellow" aria-label="Yellow"></button></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';
  const SHEET_NAME='For import', STATUS='kommer';
  const colors=['#dcfce7','#dbeafe','#fef3c7','#f3e8ff'];
  const state={players:[],groupCount:3,sourceName:'',eventInfo:{title:'',dateTime:'',location:''},activeTab:0,exercises:[]};
  const $=s=>document.querySelector(s);
  const uploadCard=$('#uploadCard'), fileInput=$('#fileInput'), workspace=$('#workspace'), groupsEl=$('#groups'), errorEl=$('#error'), bottomBar=$('#bottomBar'), eventInfoEl=$('#eventInfo'), tabsEl=$('#exerciseTabs'), trashEl=$('#trash'), colorMenu=$('#colorMenu');

  function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3000)}
  function shortName(value){const parts=String(value??'').trim().split(/\s+/).filter(Boolean);if(!parts.length)return '';return [parts[0],...parts.slice(1).map(p=>Array.from(p)[0]?.toUpperCase()).filter(Boolean)].join(' ')}
  function setError(message=''){errorEl.textContent=message}
  function findHeader(rows){return rows.findIndex(row=>{const cells=row.map(x=>String(x??'').trim().toLowerCase());return cells.includes('status')&&cells.includes('navn')})}

  async function readFile(file){
    setError('');
    try{
      if(!window.XLSX) throw new Error('The Excel reader could not load. Check your internet connection and try again.');
      const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
      if(!wb.SheetNames.includes(SHEET_NAME)) throw new Error(`Sheet “${SHEET_NAME}” was not found.`);
      const sheet=wb.Sheets[SHEET_NAME];
      const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:'',raw:false});
      const cellText=address=>{const cell=sheet[address];return String(cell?.w??cell?.v??'').trim()};
      const eventInfo={title:cellText('A1'),dateTime:cellText('A2'),location:cellText('A3')};
      const headerIndex=findHeader(rows);
      if(headerIndex<0) throw new Error('Could not find the Status and Navn columns.');
      const headers=rows[headerIndex].map(x=>String(x).trim().toLowerCase());
      const statusCol=headers.indexOf('status'), nameCol=headers.indexOf('navn');
      const players=rows.slice(headerIndex+1)
        .filter(r=>String(r[statusCol]??'').trim().toLowerCase()===STATUS)
        .map(r=>shortName(r[nameCol])).filter(Boolean);
      if(!players.length) throw new Error('No players with Status = Kommer were found.');
      state.players=players;state.sourceName=file.name;state.groupCount=3;state.eventInfo=eventInfo;state.activeTab=0;state.exercises=Array.from({length:3},()=>({groupCount:3,groups:distributePlayers(players,3)}));
      showWorkspace();
    }catch(err){setError(err?.message||'The file could not be read.');fileInput.value=''}
  }

  
  
  function startBlank(){
    state.players=[];state.sourceName='';state.groupCount=3;state.eventInfo={title:'',dateTime:'',location:''};state.activeTab=0;
    state.exercises=Array.from({length:3},()=>({groupCount:3,groups:[[],[],[]]}));
    showWorkspace();
  }

  function renderEventInfo(){const info=state.eventInfo;eventInfoEl.innerHTML='';if(info.title){const el=document.createElement('div');el.className='event-title';el.textContent=info.title;eventInfoEl.append(el)}if(info.dateTime){const el=document.createElement('div');el.className='event-meta';el.textContent=info.dateTime;eventInfoEl.append(el)}if(info.location){const el=document.createElement('div');el.className='event-meta';el.textContent=info.location;eventInfoEl.append(el)}}
  function distributePlayers(players,count){const groups=Array.from({length:count},()=>[]);players.forEach((name,i)=>groups[i%count].push(name));return groups}
  function captureGroups(){return [...groupsEl.querySelectorAll('.player-list')].map(list=>[...list.querySelectorAll('.player')].map(p=>({name:p.dataset.name,manual:p.dataset.manual==='true',color:p.dataset.color||''})))}
  function saveActiveExercise(){if(state.exercises[state.activeTab]){state.exercises[state.activeTab].groupCount=state.groupCount;state.exercises[state.activeTab].groups=captureGroups()}}
  function showWorkspace(){uploadCard.classList.add('hidden');workspace.classList.remove('hidden');bottomBar.classList.remove('hidden');renderEventInfo();switchExercise(0,false)}
  function switchExercise(index,save=true){if(save&&workspace&&!workspace.classList.contains('hidden'))saveActiveExercise();state.activeTab=index;const ex=state.exercises[index];state.groupCount=ex.groupCount;tabsEl.querySelectorAll('.tab').forEach(b=>{const active=Number(b.dataset.tab)===index;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});document.querySelectorAll('#groupChooser button').forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===state.groupCount));renderGroups(ex.groups)}
  function renderGroups(groupData){
    groupsEl.dataset.count=String(state.groupCount);groupsEl.innerHTML='';
    for(let i=0;i<state.groupCount;i++){
      const section=document.createElement('section');section.className='group';section.style.setProperty('--group-bg',colors[i]);
      section.innerHTML=`<div class="group-head"><span class="group-title">Group ${i+1}</span><span class="badge">0</span></div><div class="player-list" data-group="${i}"></div><div class="empty-note">Drop players here</div>`;
      groupsEl.append(section);
      (groupData[i]||[]).forEach(player=>addPlayer(typeof player==='string'?player:player.name,section.querySelector('.player-list'),typeof player==='object'&&player.manual,typeof player==='object'?(player.color||''):''));
    }
    activateSortables();updateCounts();
  }
  function addPlayer(name,list,manual=false,color=''){const el=document.createElement('div');el.className='player'+(manual?' manual-player':'');el.textContent=name;el.dataset.name=name;el.dataset.manual=String(manual);el.dataset.color=color;bindColorHold(el);list.append(el)}
  let colorTarget=null,holdTimer=null,holdStart=null;
  function closeColorMenu(){colorMenu.classList.add('hidden');colorTarget=null}
  function openColorMenu(player,x,y){colorTarget=player;colorMenu.style.left=`${Math.max(100,Math.min(innerWidth-100,x))}px`;colorMenu.style.top=`${Math.max(85,y)}px`;colorMenu.classList.remove('hidden')}
  function bindColorHold(player){
    const start=e=>{if(e.pointerType==='mouse'&&e.button!==0)return;holdStart={x:e.clientX,y:e.clientY};clearTimeout(holdTimer);holdTimer=setTimeout(()=>openColorMenu(player,e.clientX,e.clientY),500)};
    const move=e=>{if(holdStart&&Math.hypot(e.clientX-holdStart.x,e.clientY-holdStart.y)>10){clearTimeout(holdTimer);holdStart=null}};
    const end=()=>{clearTimeout(holdTimer);holdStart=null};
    player.addEventListener('pointerdown',start);player.addEventListener('pointermove',move);player.addEventListener('pointerup',end);player.addEventListener('pointercancel',end);
  }
  function addManualPlayer(){const entered=prompt('Enter player name');const name=String(entered??'').trim();if(!name)return;const lists=[...groupsEl.querySelectorAll('.player-list')];if(!lists.length)return;const target=lists.reduce((a,b)=>a.children.length<=b.children.length?a:b);addPlayer(name,target,true);updateCounts();saveActiveExercise();toast(`${name} added`)}
  function activateSortables(){
    groupsEl.querySelectorAll('.player-list').forEach(list=>new Sortable(list,{group:'players',animation:170,delay:180,delayOnTouchOnly:true,touchStartThreshold:8,emptyInsertThreshold:40,swapThreshold:.65,invertSwap:true,fallbackOnBody:true,ghostClass:'sortable-ghost',chosenClass:'sortable-chosen',onEnd:()=>{updateCounts();saveActiveExercise()}}));
    new Sortable(trashEl,{group:'players',sort:false,animation:150,onAdd:evt=>{evt.item.remove();trashEl.classList.remove('trash-active');updateCounts();saveActiveExercise();toast('Player deleted')},onMove:()=>{trashEl.classList.add('trash-active');return true},onEnd:()=>trashEl.classList.remove('trash-active')});
  }
  function updateCounts(){let total=0;groupsEl.querySelectorAll('.group').forEach(g=>{const n=g.querySelectorAll('.player').length;g.querySelector('.badge').textContent=n;total+=n});$('#summary').textContent=`${total} players in Exercise ${state.activeTab+1} • drag to rearrange`}
  function currentPlayers(){return [...groupsEl.querySelectorAll('.player')].map(x=>({name:x.dataset.name,manual:x.dataset.manual==='true',color:x.dataset.color||''}))}
  function changeGroupCount(count){const players=currentPlayers();state.groupCount=count;state.exercises[state.activeTab]={groupCount:count,groups:distributePlayers(players,count)};document.querySelectorAll('#groupChooser button').forEach(b=>b.classList.toggle('active',Number(b.dataset.count)===count));renderGroups(state.exercises[state.activeTab].groups)}
  function startOver(){if(!confirm('Start over and clear the current groups?'))return;state.players=[];state.sourceName='';state.eventInfo={title:'',dateTime:'',location:''};state.activeTab=0;state.exercises=[];eventInfoEl.innerHTML='';fileInput.value='';groupsEl.innerHTML='';workspace.classList.add('hidden');bottomBar.classList.add('hidden');uploadCard.classList.remove('hidden');setError('');window.location.reload();window.scrollTo({top:0,behavior:'smooth'})}

  function roundRect(ctx,x,y,w,h,r,fill){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill()}
  function buildImage(){
    const ratio=Math.min(2,window.devicePixelRatio||1); const W=1200, margin=54, gap=24, cols=state.groupCount;
    const groupData=[...groupsEl.querySelectorAll('.group')].map((g,i)=>({title:`Group ${i+1}`,names:[...g.querySelectorAll('.player')].map(p=>p.dataset.name)}));
    const eventLines=[state.eventInfo.title,state.eventInfo.dateTime,state.eventInfo.location].filter(Boolean);
    const headerH=170+eventLines.length*35, maxRows=Math.max(...groupData.map(x=>x.names.length),1), groupHeader=76, rowH=54, bottom=60;
    const H=headerH+groupHeader+maxRows*rowH+bottom;
    const canvas=document.createElement('canvas');canvas.width=W*ratio;canvas.height=H*ratio;const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);
    ctx.fillStyle='#f4faf6';ctx.fillRect(0,0,W,H);ctx.fillStyle='#0b6b3a';ctx.fillRect(0,0,W,20);
    ctx.fillStyle='#10231a';ctx.font='800 45px system-ui, sans-serif';ctx.fillText(`Football practice groups • Exercise ${state.activeTab+1}`,margin,78);
    let infoY=122;
    if(state.eventInfo.title){ctx.fillStyle='#10231a';ctx.font='750 27px system-ui, sans-serif';ctx.fillText(state.eventInfo.title,margin,infoY);infoY+=35}
    if(state.eventInfo.dateTime){ctx.fillStyle='#607268';ctx.font='500 23px system-ui, sans-serif';ctx.fillText(state.eventInfo.dateTime,margin,infoY);infoY+=35}
    if(state.eventInfo.location){ctx.fillStyle='#607268';ctx.font='500 23px system-ui, sans-serif';ctx.fillText(state.eventInfo.location,margin,infoY);infoY+=35}
    ctx.fillStyle='#607268';ctx.font='500 21px system-ui, sans-serif';ctx.fillText(`${currentPlayers().length} players`,margin,infoY);
    const innerW=W-2*margin, colW=(innerW-gap*(cols-1))/cols;
    groupData.forEach((group,i)=>{
      const x=margin+i*(colW+gap), y=headerH;
      roundRect(ctx,x,y,colW,groupHeader+maxRows*rowH,18,'#ffffff');
      ctx.fillStyle=colors[i];ctx.beginPath();ctx.roundRect(x,y,colW,groupHeader,[18,18,0,0]);ctx.fill();
      ctx.fillStyle='#10231a';ctx.font='800 27px system-ui, sans-serif';ctx.fillText(group.title,x+20,y+47);
      ctx.font='700 22px system-ui, sans-serif';ctx.textAlign='right';ctx.fillText(String(group.names.length),x+colW-20,y+45);ctx.textAlign='left';
      group.names.forEach((name,j)=>{const yy=y+groupHeader+j*rowH;const playerEl=[...groupsEl.querySelectorAll('.group')][i].querySelectorAll('.player')[j];const cardColors={red:'#ffd9d5',blue:'#dbeafe',green:'#dcfce7',yellow:'#fef3c7'};const cardColor=cardColors[playerEl?.dataset.color]||(playerEl?.dataset.manual==='true'?'#ffe4e1':'');if(cardColor){ctx.fillStyle=cardColor;ctx.fillRect(x+1,yy+1,colW-2,rowH-1)}ctx.strokeStyle='#e1e9e4';ctx.beginPath();ctx.moveTo(x+18,yy+rowH);ctx.lineTo(x+colW-18,yy+rowH);ctx.stroke();ctx.fillStyle='#10231a';ctx.font='650 23px system-ui, sans-serif';ctx.fillText(name,x+20,yy+35,colW-38)});
    });
    ctx.fillStyle='#839087';ctx.font='500 18px system-ui, sans-serif';ctx.fillText('Created with Football Group Maker',margin,H-25);
    return canvas;
  }
  async function downloadImage(){ const canvas=buildImage(); const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Image creation failed')),'image/png')); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`football-groups-exercise-${state.activeTab+1}.png`; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }

  async function exportImage(){
    const button=$('#exportBtn'), original=button.textContent;button.disabled=true;button.textContent='Creating image…';
    try{
      const canvas=buildImage(); const blob=await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('Image creation failed')),'image/png'));
      if(navigator.clipboard&&window.ClipboardItem&&window.isSecureContext){await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('Groups copied to clipboard')}
      else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`football-groups-exercise-${state.activeTab+1}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Image downloaded. Clipboard access requires HTTPS or localhost.')}
    }catch(err){toast(err?.message||'Could not export image')}
    finally{button.disabled=false;button.textContent=original}
  }

  fileInput.addEventListener('change',e=>e.target.files[0]&&readFile(e.target.files[0]));
  uploadCard.addEventListener('dragover',e=>{e.preventDefault();uploadCard.classList.add('dragover')});
  uploadCard.addEventListener('dragleave',()=>uploadCard.classList.remove('dragover'));
  uploadCard.addEventListener('drop',e=>{e.preventDefault();uploadCard.classList.remove('dragover');const f=e.dataTransfer.files[0];if(f)readFile(f)});
  tabsEl.addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b)switchExercise(Number(b.dataset.tab))});
  $('#groupChooser').addEventListener('click',e=>{const b=e.target.closest('button[data-count]');if(b)changeGroupCount(Number(b.dataset.count))});
  $('#addPlayerBtn').addEventListener('click',addManualPlayer);if($('#blankListBtn'))$('#blankListBtn').addEventListener('click',startBlank);
  colorMenu.addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(!b||!colorTarget)return;colorTarget.dataset.color=b.dataset.color;saveActiveExercise();closeColorMenu();toast(`Player color set to ${b.dataset.color}`)});
  document.addEventListener('pointerdown',e=>{if(!colorMenu.classList.contains('hidden')&&!colorMenu.contains(e.target)&&!e.target.closest('.player'))closeColorMenu()});
  $('#exportBtn').addEventListener('click',exportImage);$('#downloadBtn').addEventListener('click',downloadImage);$('#resetBtn').addEventListener('click',startOver);
})();
</script>
</body>
</html>
